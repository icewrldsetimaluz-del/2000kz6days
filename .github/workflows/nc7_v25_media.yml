name: Build Núcleo Controlo V25 media
on:
  push:
    paths:
      - 'automation/nc7_v25_media.py'
      - '.github/workflows/nc7_v25_media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: python -m pip install pillow
      - name: Install video renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Produce campaign media
        run: python automation/nc7_v25_media.py
      - name: Publish original media to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nc7_v25
          if ! git diff --cached --quiet; then
            git commit -m "Publish Núcleo Controlo V25 campaign media"
            git push origin HEAD:main
          fi
